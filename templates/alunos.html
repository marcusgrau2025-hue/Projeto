{% extends "base.html" %}
{% block conteudo %}
<h2>Alunos</h2>
<form method="post">
  <input name="nome" placeholder="Nome" required>
  <input name="email" placeholder="E-mail" required>
  <input name="matricula" placeholder="Matrícula" required>
  <button type="submit">Cadastrar aluno</button>
</form>
<table>
  <tr><th>Nome</th><th>E-mail</th><th>Matrícula</th><th>Ação</th></tr>
  {% for i, a in lista %}
  <tr>
    <td>{{ a.nome }}</td><td>{{ a.email }}</td><td>{{ a.matricula }}</td>
    <td><form method="post" action="{{ url_for('excluir_aluno', i=i) }}"><button>Excluir</button></form></td>
  </tr>
  {% else %}
  <tr><td colspan="4">Nenhum aluno cadastrado.</td></tr>
  {% endfor %}
</table>
{% endblock %}
